[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dafeiyu"
version = "0.1.0"
description = "轻量级控制台行情与持仓收益工具"
requires-python = ">=3.10"
dependencies = ["rich>=14.1,<15"]

[project.scripts]
dafeiyu = "dafeiyu.cli:main"

[tool.setuptools.packages.find]
include = ["dafeiyu*"]

[tool.setuptools.package-data]
dafeiyu = ["config.default.json"]
